<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha ganadera</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#23291f;--mut:#6b705f;--ac:#3f6b3a;--acx:#fff;--bd:#dcd8ca;--dg:#a33a2a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e17;--card:#262a21;--tx:#ecebe2;--mut:#a3a794;--ac:#8fbf86;--acx:#13200f;--bd:#3a3f33;--dg:#e58a78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1e17;--card:#262a21;--tx:#ecebe2;--mut:#a3a794;--ac:#8fbf86;--acx:#13200f;--bd:#3a3f33;--dg:#e58a78;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 8px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--dg)}button.s{padding:5px 10px;font-size:14px}
input,select,textarea{text-transform:uppercase;font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.cb{width:26px;height:26px;border:2px solid var(--tx);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1;cursor:pointer}
.ck td,.ck th{text-align:center}
.ck .cb{margin:0 auto}
tr.done .cb::after{content:"\2715"}
tr.done td:not(:first-child){text-decoration:line-through;color:var(--mut)}
.v{flex:1;background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:600}
.bad{border-color:var(--dg)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.it{cursor:pointer;padding:0;overflow:hidden}
.it .im{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:34px}
.it img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.it .tx{padding:10px}.it b{display:block;text-transform:uppercase}.it span{font-size:13px;color:var(--mut)}
.ph{aspect-ratio:4/3;border:1px dashed var(--bd);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);background:var(--bg);text-align:center;font-size:14px}
.ro{display:flex;gap:8px;margin-top:6px}
.rows{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
td,th{padding:4px;text-align:left;font-size:13px;color:var(--mut);font-weight:400;vertical-align:bottom}
td input,td select{padding:6px}
.k{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--bd);margin-top:18px}
.msg{font-size:13px;color:var(--mut);margin:6px 0}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
/* ===== Almacenamiento local (IndexedDB) y descargas: todo queda en el móvil ===== */
var DBX=(function(){
  var P=new Promise(function(ok,ko){var r=indexedDB.open('ficha-ganadera',1);r.onupgradeneeded=function(){var d=r.result;['animales','parcelas','ajustes'].forEach(function(n){d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){ko(r.error)}});
  var subs={};
  function req(r){return new Promise(function(ok,ko){r.onsuccess=function(){ok(r.result)};r.onerror=function(){ko(r.error)}})}
  function all(n){return P.then(function(d){return req(d.transaction(n,'readonly').objectStore(n).getAll())})}
  function snap(rows){return{docs:rows.map(function(x){return{id:x.id,data:function(){return x}}})}}
  function emit(n){all(n).then(function(rows){(subs[n]||[]).forEach(function(cb){cb(snap(rows))})})}
  return {collection:function(n){return{
    doc:function(id){return{
      set:function(o){var v=Object.assign({},o,{id:id});return P.then(function(d){return req(d.transaction(n,'readwrite').objectStore(n).put(v))}).then(function(){emit(n)})},
      delete:function(){return P.then(function(d){return req(d.transaction(n,'readwrite').objectStore(n).delete(id))}).then(function(){emit(n)})}}},
    onSnapshot:function(cb,err){(subs[n]=subs[n]||[]).push(cb);all(n).then(function(rows){cb(snap(rows))},function(e){if(err)err(e)})}}}};
})();
var claude={use:async function(n){
  if(n=='db')return DBX;
  if(n=='downloads')return {save:async function(r){
    var b=r.data instanceof Blob?r.data:new Blob([r.data],{type:/\.csv$/.test(r.filename)?'text/csv;charset=utf-8':'application/json'});
    var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},5000);return {status:'saved'}}};
  return null}};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

function jpgPdf(jp,cw,ch,w,h){
  var parts=[],off=[],len=0,te=new TextEncoder();
  function add(x){var b=typeof x=='string'?te.encode(x):x;parts.push(b);len+=b.length}
  function start(i){off[i]=len;add(i+' 0 obj\n')}
  var n=jp.length,kids=[],i;
  add('%PDF-1.4\n');
  start(1);add('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  for(i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  start(2);add('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
  for(i=0;i<n;i++){
    var p=3+3*i,c=p+1,im=p+2,cs='q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q';
    start(p);add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+c+' 0 R >>\nendobj\n');
    start(c);add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    start(im);add('<< /Type /XObject /Subtype /Image /Width '+cw+' /Height '+ch+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp[i].length+' >>\nstream\n');add(jp[i]);add('\nendstream\nendobj\n');
  }
  var xr=len,tot=3+3*n,x='xref\n0 '+tot+'\n0000000000 65535 f \n';
  for(i=1;i<tot;i++)x+=('0000000000'+off[i]).slice(-10)+' 00000 n \n';
  add(x+'trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
var db=null,assets=null,col=null,pcol=null,acol=null,ajustes={saneamiento:''},animals=[],parcelas=[],pscr=false,chk=false,curP=null,cur=null,q='',local=false,status='';
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blank(){return{id:uid(),crotal:'',nombre:'',nacimiento:'',sexo:'Hembra',parcela:'',raza:'',fotoCabeza:'',fotoLateral:'',partos:[],vet:[],notas:''}}
function d(s){return s?new Date(s+'T00:00:00'):null}
function edad(s){var n=d(s);if(!n)return '';var t=new Date(),m=(t.getFullYear()-n.getFullYear())*12+t.getMonth()-n.getMonth();if(t.getDate()<n.getDate())m--;if(m<0)return '';var a=Math.floor(m/12),r=m%12;return (a?a+(a==1?' año':' años'):'')+(a&&r?' y ':'')+((r||!a)?r+(r==1?' mes':' meses'):'')}
function fmt(s){var x=d(s);return x?x.toLocaleDateString('es-ES'):''}
function intervalos(p){var f=p.map(function(x){return x.fecha}).filter(Boolean).sort(),o=[];for(var i=1;i<f.length;i++){o.push(Math.round((d(f[i])-d(f[i-1]))/864e5))}return o}
function mesesTxt(dias){return dias+' días (≈ '+(dias/30.44).toFixed(1).replace('.',',')+' meses)'}

async function init(){
  render();
  try{
    var c=await claude.use('db'); assets=await claude.use('assets');
    if(!c){local=true;status='Sin almacenamiento persistente: los datos se perderán al cerrar.';render();return}
    db=c;col=db.collection('animales');pcol=db.collection('parcelas');pcol.onSnapshot(function(s){parcelas=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});if(!(cur&&cur._dirty)&&!(curP&&curP._dirty))render()},function(){});acol=db.collection('ajustes');acol.onSnapshot(function(s){var g=s.docs.find(function(x){return x.id==='general'});ajustes=Object.assign({saneamiento:''},g?g.data():{});var ae=document.activeElement;if(!cur&&!curP&&!pscr&&!chk&&!(ae&&ae.id==='san'))render()},function(){});
    col.onSnapshot(function(s){animals=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});if(!(cur&&cur._dirty)&&!(curP&&curP._dirty))render()},function(){status='No se pudo leer la base de datos.';render()});
  }catch(e){local=true;status='Sin almacenamiento persistente.';render()}
}

function render(){
  var a=$('#app'); if(!a)return;
  a.innerHTML=curP?parcelaForm():chk?checkView():pscr?parcelasView():cur?formView():listView();
}
function listView(){
  var f=animals.filter(function(x){var t=(x.crotal+' '+x.nombre+' '+(x.raza||'')).toLowerCase();return t.indexOf(q.toLowerCase())>-1}).sort(function(x,y){return (x.nombre||'').localeCompare(y.nombre||'')});
  var h='<div class="top"><h1>🐄 Mi ganadería</h1><div style="display:flex;gap:8px;width:100%"><button class="v" onclick="nuevaP()">PARCELA</button><button class="v" onclick="nuevo()">ANIMAL</button><button class="v" onclick="chk=true;render()">CHECK LIST</button></div></div>'+
  '<input id="q" placeholder="Buscar por crotal, nombre o raza…" value="'+esc(q)+'" oninput="q=this.value;renderList()">'+(status?'<div class="msg">'+esc(status)+'</div>':'')+'<div class="msg"><a onclick="verParcelas()" style="text-decoration:underline;cursor:pointer">Ver parcelas ('+parcelas.length+')</a></div>'+
  '<div class="list" id="lst">'+(q?cards(f):'')+'</div>'+resumen()+
  '<h2>Copia de seguridad</h2><div class="card"><div class="ro" style="flex-wrap:wrap;margin:0"><button class="s" onclick="expCsv(\'partos\')">⬇ Excel: fichas y partos</button><button class="s" onclick="expCsv(\'vet\')">⬇ Excel: veterinario</button><button class="s" onclick="expJson()">⬇ Copia completa (.json)</button><button class="s" onclick="impJson()">⬆ Restaurar copia</button></div><div class="msg" id="bm">'+(ajustes.lastBackup?'Última copia completa: '+isoToEs(ajustes.lastBackup)+'. ':'Aún no has hecho ninguna copia completa. ')+'Los datos solo están en este móvil: haz copias a menudo. Los archivos Excel no incluyen las fotos; la copia completa (.json) sí.</div></div>';
  return h;
}
function cards(f){
  if(!f.length)return '<div class="msg">No hay fichas todavía.</div>';
  return f.map(function(x){return '<div class="card it" onclick="abrir(\''+x.id+'\')"><div class="im">'+(x.fotoLateral?'<img src="'+esc(x.fotoLateral)+'" alt="">':'🐂')+'</div><div class="tx"><b>'+esc(titulo(x)=='Nueva ficha'?'Sin nombre':titulo(x))+'</b><span>Crotal '+esc(x.crotal||'—')+'</span><br><span>'+esc(edad(x.nacimiento))+'</span>'+(nomP(x.parcela)?'<br><span>📍 '+esc(nomP(x.parcela))+'</span>':'')+'</div></div>'}).join('');
}
function renderList(){var f=animals.filter(function(x){var t=(x.crotal+' '+x.nombre+' '+(x.raza||'')).toLowerCase();return t.indexOf(q.toLowerCase())>-1}).sort(function(x,y){return (x.nombre||'').localeCompare(y.nombre||'')});$('#lst').innerHTML=q?cards(f):''}
function nuevo(){cur=blank();cur._new=true;render()}
function abrir(id){var x=animals.find(function(z){return z.id===id});cur=JSON.parse(JSON.stringify(x));render()}
function volver(){cur=null;render()}

function photo(k,t){return '<div><label>'+t+'</label><div class="ph" id="ph_'+k+'">'+(cur[k]?'<img src="'+esc(cur[k])+'" alt="'+t+'">':'Sin foto')+'</div><div class="ro"><button class="s" onclick="pick(\''+k+'\')">📷 '+(cur[k]?'Cambiar':'Añadir')+'</button>'+(cur[k]?'<button class="s d" onclick="quitar(\''+k+'\')">Quitar</button>':'')+'</div></div>'}
function formView(){
  var x=cur,iv=intervalos(x.partos),med=iv.length?Math.round(iv.reduce(function(a,b){return a+b},0)/iv.length):null;
  var h='<div class="top"><button onclick="volver()" aria-label="Volver" style="display:flex;align-items:center;justify-content:center;width:48px;height:44px;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h1 id="tt">'+esc(titulo(x))+'</h1></div>'+
  '<div class="card"><div class="g">'+
  '<div><label>Nº de crotal</label><input value="'+esc(x.crotal)+'" oninput="cur.crotal=this.value;cur._dirty=1;tit()"></div>'+
  '<div><label>Nombre</label><input value="'+esc(x.nombre)+'" oninput="cur.nombre=this.value;cur._dirty=1;tit()"></div>'+
  '<div><label>Fecha de nacimiento</label><input type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" value="'+esc(isoToEs(x.nacimiento))+'" oninput="fechaEs(this)"></div>'+
  '<div><label>Edad</label><div id="ed" style="padding:9px 0;font-weight:600">'+(esc(edad(x.nacimiento))||'—')+'</div></div>'+
  '<div><label>Sexo</label><select onchange="cur.sexo=this.value;cur._dirty=1"><option'+(x.sexo=='Hembra'?' selected':'')+'>Hembra</option><option'+(x.sexo=='Macho'?' selected':'')+'>Macho</option></select></div>'+
  '<div><label>Raza</label><input value="'+esc(x.raza)+'" oninput="cur.raza=this.value;cur._dirty=1"></div></div></div>'+
  parcelaSel(x)+'<h2>Fotos</h2><div class="g">'+photo('fotoCabeza','Cabeza (de frente)')+photo('fotoLateral','Animal entero (lateral)')+'</div><div class="msg" id="pm"></div>'+
  '<h2>Partos</h2><div class="card"><div class="rows"><table><tr><th>Fecha parto</th><th>Sexo ternero</th><th>Destino</th><th>Fecha venta</th><th>Valor (€)</th><th>Intervalo</th><th></th></tr>'+
  x.partos.map(function(p,i){return '<tr><td><input type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" style="min-width:104px" value="'+esc(isoToEs(p.fecha))+'" oninput="fechaCampo(this,cur.partos['+i+'],\'fecha\')" onchange="fechaFin(this,1)"></td>'+
  '<td><select onchange="cur.partos['+i+'].sexo=this.value;cur._dirty=1"><option></option><option'+(p.sexo=='Macho'?' selected':'')+'>Macho</option><option'+(p.sexo=='Hembra'?' selected':'')+'>Hembra</option></select></td>'+
  '<td><select onchange="cur.partos['+i+'].destino=this.value;cur._dirty=1;render()"><option></option><option'+(p.destino=='Vendido'?' selected':'')+'>Vendido</option><option'+(p.destino=='Recría'?' selected':'')+'>Recría</option><option'+(p.destino=='Muerto'?' selected':'')+'>Muerto</option></select></td>'+
  '<td><input type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" style="min-width:104px" '+(p.destino=='Vendido'?'':'disabled ')+'value="'+esc(isoToEs(p.venta))+'" oninput="fechaCampo(this,cur.partos['+i+'],\'venta\')" onchange="fechaFin(this,0)"></td>'+
  '<td><input type="number" step="0.01" inputmode="decimal" '+(p.destino=='Vendido'?'':'disabled ')+'value="'+esc(p.valor)+'" oninput="cur.partos['+i+'].valor=this.value;cur._dirty=1"></td>'+
  '<td style="white-space:nowrap">'+ivTxt(i)+'</td><td><button class="s d" onclick="cur.partos.splice('+i+',1);render()">✕</button></td></tr>'}).join('')+
  '</table></div><button class="s" onclick="cur.partos.push({fecha:\'\',sexo:\'\',destino:\'\',venta:\'\',valor:\'\'});cur._dirty=1;render()">+ Añadir parto</button>'+
  '<div style="margin-top:10px"><span class="k">Partos: '+x.partos.length+'</span>'+(med!=null?'<span class="k">Intervalo medio entre partos: '+mesesTxt(med)+'</span>':'')+'</div></div>'+
  '<h2>Datos veterinarios</h2><div class="card"><div class="rows"><table><tr><th>Fecha</th><th>Tipo</th><th>Descripción / producto</th><th>Veterinario</th><th>Notas</th><th></th></tr>'+
  x.vet.map(function(v,i){return '<tr><td><input type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" style="min-width:104px" value="'+esc(isoToEs(v.fecha))+'" oninput="fechaCampo(this,cur.vet['+i+'],\'fecha\')" onchange="fechaFin(this,0)"></td>'+
  '<td><select onchange="cur.vet['+i+'].tipo=this.value;cur._dirty=1">'+['Vacuna','Tratamiento','Revisión','Saneamiento','Desparasitación','Análisis','Otro'].map(function(t){return '<option'+(v.tipo==t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></td>'+
  '<td><input value="'+esc(v.desc)+'" oninput="cur.vet['+i+'].desc=this.value;cur._dirty=1"></td>'+
  '<td><input value="'+esc(v.vet)+'" oninput="cur.vet['+i+'].vet=this.value;cur._dirty=1"></td>'+
  '<td><input value="'+esc(v.notas)+'" oninput="cur.vet['+i+'].notas=this.value;cur._dirty=1"></td>'+
  '<td><button class="s d" onclick="cur.vet.splice('+i+',1);render()">✕</button></td></tr>'}).join('')+
  '</table></div><button class="s" onclick="cur.vet.push({fecha:\'\',tipo:\'Vacuna\',desc:\'\',vet:\'\',notas:\'\'});cur._dirty=1;render()">+ Añadir registro</button></div>'+
  '<h2>Notas</h2><textarea rows="3" oninput="cur.notas=this.value;cur._dirty=1">'+esc(x.notas)+'</textarea>'+
  '<div class="bar"><button class="d" onclick="borrar()"'+(cur._new?' style="visibility:hidden"':'')+'>Eliminar</button><button class="p" onclick="guardar()">Guardar ficha</button></div><div class="msg" id="sm"></div>';
  return h;
}
function ivTxt(i){var f=cur.partos.map(function(p,k){return{f:p.fecha,k:k}}).filter(function(p){return p.f}).sort(function(a,b){return a.f<b.f?-1:1});var pos=f.findIndex(function(p){return p.k===i});if(pos<1)return '—';var n=Math.round((d(f[pos].f)-d(f[pos-1].f))/864e5);return n+' d (≈ '+(n/30.44).toFixed(1).replace('.',',')+' m)'}

function pick(k){
  var i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async function(){
    var f=i.files[0];if(!f)return;
    $('#pm').textContent='Subiendo foto…';
    try{
      var blob=await shrink(f);
      if(assets){var r=await assets.upload(blob);cur[k]=r.url}
      else{cur[k]=await new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok(fr.result)};fr.readAsDataURL(blob)})}
      cur._dirty=1;render();
    }catch(e){$('#pm').textContent='No se pudo subir la foto.'}
  };i.click();
}
function shrink(f){return new Promise(function(ok,ko){var im=new Image();im.onload=function(){var m=1280,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):ko()},'image/jpeg',.82)};im.onerror=ko;im.src=URL.createObjectURL(f)})}
function quitar(k){cur[k]='';cur._dirty=1;render()}
async function guardar(){
  var o=JSON.parse(JSON.stringify(cur));delete o._dirty;delete o._new;
  ['crotal','nombre','raza','notas'].forEach(function(k){o[k]=String(o[k]||'').toUpperCase()});
  (o.vet||[]).forEach(function(v){['desc','vet','notas'].forEach(function(k){v[k]=String(v[k]||'').toUpperCase()})});
  if(document.querySelector('.bad')){$('#sm').textContent='Hay fechas no válidas o incompletas: corrígelas antes de guardar.';return}

  var c=carga(p),T={TORO:0,NOVILLO:0,VACA:0,NOVILLA:0,TERNERO:0};
  animals.forEach(function(a){if(a.parcela===p.id){var t=tipo(a);if(T[t]!=null)T[t]++}});
  var f=function(k,v){return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+k+'</span><b>'+v+'</b></div>'};
  return '<div class="card" style="margin-top:10px"><div class="msg" style="margin:0 0 4px">Carga ganadera</div>'+
    f('Animales',c.n)+'<div class="msg" style="margin:0 0 6px">'+T.TORO+' toros · '+T.NOVILLO+' novillos · '+T.VACA+' vacas · '+T.NOVILLA+' novillas · '+T.TERNERO+' terneros</div>'+
    f('UGM totales',fmtHa(c.ugm))+f('Animales por hectárea',c.anHa==null?'—':fmtHa(c.anHa))+f('UGM por hectárea',c.ugmHa==null?'—':fmtHa(c.ugmHa))+
    (c.sin?'<div class="msg">'+c.sin+' animal(es) sin fecha de nacimiento no cuentan en las UGM.</div>':'')+
    (c.ugmHa==null?'<div class="msg">Indica la superficie para calcular la carga por hectárea.</div>':'')+
    '<div class="msg" style="margin:6px 0 0">UGM (unidad de ganado mayor): ternero 0,4 · novillo/novilla 0,6 · vaca/toro 1.</div></div>';
}
function actCarga(){var e=$('#cg');if(e&&curP)e.innerHTML=cargaHtml(curP)}
function isoToEs(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''}
function fechaEs(el){
  var v=el.value.replace(/\D/g,'').slice(0,8),o=v;
  if(v.length>4)o=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)o=v.slice(0,2)+'/'+v.slice(2);
  el.value=o;cur._dirty=1;
  var ok=false,iso='';
  if(v.length==8){var dd=+v.slice(0,2),mm=+v.slice(2,4),aa=+v.slice(4),t=new Date(aa,mm-1,dd);ok=t.getFullYear()==aa&&t.getMonth()==mm-1&&t.getDate()==dd&&t<=new Date()&&aa>1980;if(ok)iso=v.slice(4)+'-'+v.slice(2,4)+'-'+v.slice(0,2)}
  cur.nacimiento=iso;
  el.classList.toggle('bad',v.length==8&&!ok);
  $('#ed').textContent=(ok&&edad(iso))||(v.length==8&&!ok?'Fecha no válida':'—');
}
function csv(rows){return '\ufeff'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n')}
async function guardaArchivo(name,data){var m=$('#bm');try{var dl=await claude.use('downloads');if(!dl){m.textContent='La descarga no está disponible aquí.';return}await dl.save({filename:name,data:data});m.textContent='Archivo preparado: '+name}catch(e){m.textContent=(e&&e.code=='declined')?'Descarga cancelada.':'No se pudo descargar el archivo.'}}
function expCsv(t){
  var r=[],hoy=new Date().toISOString().slice(0,10);
  if(t=='partos'){r.push(['Crotal','Nombre','Sexo','Raza','Nacimiento','Edad','Parcela','Fecha parto','Sexo ternero','Destino','Fecha venta','Valor €','Intervalo (días)']);
    animals.forEach(function(a){var p=(a.partos||[]).slice().sort(function(x,y){return (x.fecha||'')<(y.fecha||'')?-1:1});var base=[a.crotal,a.nombre,a.sexo,a.raza,isoToEs(a.nacimiento),edad(a.nacimiento),nomP(a.parcela)];
      if(!p.length){r.push(base.concat(['','','','','','']));return}
      p.forEach(function(x,i){var iv=(i>0&&x.fecha&&p[i-1].fecha)?Math.round((d(x.fecha)-d(p[i-1].fecha))/864e5):'';r.push(base.concat([isoToEs(x.fecha),x.sexo,x.destino,isoToEs(x.venta),String(x.valor||'').replace('.',','),iv]))})})}
  else{r.push(['Crotal','Nombre','Fecha','Tipo','Descripción / producto','Veterinario','Notas']);
    animals.forEach(function(a){(a.vet||[]).forEach(function(v){r.push([a.crotal,a.nombre,isoToEs(v.fecha),v.tipo,v.desc,v.vet,v.notas])})})}
  guardaArchivo('ganaderia-'+t+'-'+hoy+'.csv',csv(r));
}
function expJson(){ajustes.lastBackup=new Date().toISOString().slice(0,10);if(acol)acol.doc('general').set(ajustes);guardaArchivo('ganaderia-copia-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,animales:animals,parcelas:parcelas,ajustes:ajustes},null,1))}
function impJson(){
  var i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async function(){var f=i.files[0];if(!f)return;var m=$('#bm');
    try{var o=JSON.parse(await f.text());var l=o.animales||[];if(!l.length){m.textContent='La copia no contiene animales.';return}
      if(!confirm('Se restaurarán '+l.length+' fichas. Las que tengan el mismo identificador se sobrescribirán. ¿Continuar?'))return;
      for(var k=0;k<l.length;k++){var a=l[k];['fotoCabeza','fotoLateral'].forEach(function(f){if(String(a[f]||'').indexOf('/_blob/')===0)a[f]=''});if(col)await col.doc(a.id).set(a);else{var j=animals.findIndex(function(z){return z.id===a.id});if(j>-1)animals[j]=a;else animals.push(a)}}
      if(o.ajustes){ajustes=Object.assign({saneamiento:''},o.ajustes);if(acol)await acol.doc('general').set(ajustes)}
      var pl=o.parcelas||[];for(var z=0;z<pl.length;z++){if(pcol)await pcol.doc(pl[z].id).set(pl[z]);else{var w=parcelas.findIndex(function(y){return y.id===pl[z].id});if(w>-1)parcelas[w]=pl[z];else parcelas.push(pl[z])}}
      m.textContent='Restauradas '+l.length+' fichas.';if(!col)render()}catch(e){m.textContent='No se pudo leer la copia.'}};
  i.click();
}
init();
</script>
