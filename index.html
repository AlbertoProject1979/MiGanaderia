<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha ganadera</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#23291f;--mut:#6b705f;--ac:#3f6b3a;--acx:#fff;--bd:#dcd8ca;--dg:#a33a2a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e17;--card:#262a21;--tx:#ecebe2;--mut:#a3a794;--ac:#8fbf86;--acx:#13200f;--bd:#3a3f33;--dg:#e58a78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1e17;--card:#262a21;--tx:#ecebe2;--mut:#a3a794;--ac:#8fbf86;--acx:#13200f;--bd:#3a3f33;--dg:#e58a78;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 8px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--dg)}button.s{padding:5px 10px;font-size:14px}
input,select,textarea{text-transform:uppercase;font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.cb{width:26px;height:26px;border:2px solid var(--tx);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1;cursor:pointer}
.ck td,.ck th{text-align:center}
.ck .cb{margin:0 auto}
tr.done .cb::after{content:"\2715"}
tr.done td:not(:first-child){text-decoration:line-through;color:var(--mut)}
.lr{grid-template-columns:1fr}
.lr .it{display:flex}
.lr .it .im{width:120px;flex:none;min-height:96px;aspect-ratio:auto}
.v{flex:1;background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:600}
.bad{border-color:var(--dg)}
.pf{padding:4px 2px;font-size:12px;text-align:center;width:100%}
select.pf{-webkit-appearance:none;appearance:none;background-image:none}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.it{cursor:pointer;padding:0;overflow:hidden}
.it .im{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:34px}
.it img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.it .tx{padding:10px}.it b{display:block;text-transform:uppercase}.it span{font-size:13px;color:var(--mut)}
.ph{aspect-ratio:4/3;border:1px dashed var(--bd);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);background:var(--bg);text-align:center;font-size:14px}
.ro{display:flex;gap:8px;margin-top:6px}
.rows{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
td,th{padding:4px;text-align:left;font-size:13px;color:var(--mut);font-weight:400;vertical-align:bottom}
td input,td select{padding:6px}
.k{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--bd);margin-top:18px}
.msg{font-size:13px;color:var(--mut);margin:6px 0}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
/* ===== Almacenamiento local (IndexedDB) y descargas: todo queda en el móvil ===== */
var DBX=(function(){
  var P=new Promise(function(ok,ko){var r=indexedDB.open('ficha-ganadera',1);r.onupgradeneeded=function(){var d=r.result;['animales','parcelas','ajustes'].forEach(function(n){d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){ko(r.error)}});
  var subs={};
  function req(r){return new Promise(function(ok,ko){r.onsuccess=function(){ok(r.result)};r.onerror=function(){ko(r.error)}})}
  function all(n){return P.then(function(d){return req(d.transaction(n,'readonly').objectStore(n).getAll())})}
  function snap(rows){return{docs:rows.map(function(x){return{id:x.id,data:function(){return x}}})}}
  function emit(n){all(n).then(function(rows){(subs[n]||[]).forEach(function(cb){cb(snap(rows))})})}
  return {collection:function(n){return{
    doc:function(id){return{
      set:function(o){var v=Object.assign({},o,{id:id});return P.then(function(d){return req(d.transaction(n,'readwrite').objectStore(n).put(v))}).then(function(){emit(n)})},
      delete:function(){return P.then(function(d){return req(d.transaction(n,'readwrite').objectStore(n).delete(id))}).then(function(){emit(n)})}}},
    onSnapshot:function(cb,err){(subs[n]=subs[n]||[]).push(cb);all(n).then(function(rows){cb(snap(rows))},function(e){if(err)err(e)})}}}};
})();
var claude={use:async function(n){
  if(n=='db')return DBX;
  if(n=='downloads')return {save:async function(r){
    var b=r.data instanceof Blob?r.data:new Blob([r.data],{type:/\.csv$/.test(r.filename)?'text/csv;charset=utf-8':'application/json'});
    var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},5000);return {status:'saved'}}};
  return null}};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

  var h0=hoyF||new Date(),hoy=new Date(h0.getFullYear(),h0.getMonth(),h0.getDate()),DAY=864e5;
  var tot=Math.round((fin-ini)/DAY),t=Math.round((hoy-ini)/DAY),r=tot-t,ph=[];
  if(t>=0){if(t<30)ph.push('FASE POSPARTO');else if(t<90)ph.push('FASE LACTACIÓN INICIAL');else if(t<150)ph.push('FASE LACTACIÓN FINAL');else if(t<210)ph.push('FASE DE DESTETE')}
  if(r>=0){if(r<30)ph.push('PREPARTO');else if(r<90)ph.push('GESTACIÓN AVANZADA');else if(r<180)ph.push('GESTACIÓN MEDIA');else if(r<270)ph.push('GESTACIÓN INICIAL')}
  return {ini:ini,fin:fin,t:t,tot:tot,r:r,ph:ph,pct:Math.max(0,Math.min(1,t/tot))};
}
function gestionHtml(x){

    '<div style="position:relative;height:12px;margin:0 14px;background:var(--bg);border:1px solid var(--bd);border-radius:8px"><div style="position:absolute;left:0;top:0;bottom:0;width:'+pc+'%;background:#2e7d32;border-radius:8px 0 0 8px"></div><div style="position:absolute;top:50%;left:'+pc+'%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;border:3px solid #2e7d32;box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;line-height:1"><img src="'+COW+'" alt="" style="width:20px;height:auto"></div></div>'+
    '<div style="text-align:center;margin-top:18px;font-weight:700">'+txt+'</div><div class="msg" style="display:flex;justify-content:space-between;margin:2px 0 0"><span>Día '+Math.max(0,g.t)+' de '+g.tot+'</span><span>quedan '+Math.max(0,g.r)+' días</span></div></div>';

function ternerosHtml(x){
  var t=animals.filter(function(a){var m=meses(a.nacimiento);return a.madreId===x.id&&a.id!==x.id&&m>=0&&m<7});

function ncIcon(v){v=String(v==null?'':v);return v==='0'?SVGN:v==='1'?SVGT:v==='2'?SVGT+SVGV:''}
function ncOpts(x){var v=String(x.ncrotales==null?'':x.ncrotales);return ['','0','1','2'].map(function(o){return '<option value="'+o+'"'+(v===o?' selected':'')+'>'+(o===''?'—':o)+'</option>'}).join('')}
function ncInp(el){cur.ncrotales=el.value;cur._dirty=1;var e=$('#ncIcon');if(e)e.innerHTML=ncIcon(el.value)}
function sanCard(){
  return '<div class="card" style="margin-top:10px"><div style="display:flex;align-items:center;gap:10px"><label style="margin:0;white-space:nowrap;font-size:15px;color:var(--tx);font-weight:600">ÚLTIMO SANEAMIENTO</label><input id="san" style="flex:1;min-width:0;text-align:center" inputmode="numeric" placeholder="dd/mm/aa" maxlength="10" value="'+esc(isoToEs(ajustes.saneamiento))+'" oninput="fechaCampo(this,ajustes,\'saneamiento\')" onchange="guardaAjuste()"></div><div class="msg" id="sanm"></div></div>';
}
async function guardaAjuste(){
  var el=$('#san'),m=$('#sanm');
  if(el.value&&el.value.length<10)el.classList.add('bad');
  if(el.classList.contains('bad')){m.textContent='Fecha no válida o incompleta.';return}
  try{if(acol)await acol.doc('general').set(ajustes);m.textContent=ajustes.saneamiento?'Guardado.':''}catch(e){m.textContent='No se pudo guardar. Comprueba que tienes permiso de edición.'}
}
function vacasEdad(){
  var b=[[1,5],[6,10],[11,15]],c=[0,0,0];
  animals.forEach(function(a){
    if(a.sexo!='Hembra'||!(a.partos||[]).some(function(p){return p.fecha}))return;
    var y=anios(a.nacimiento);
    b.forEach(function(r,i){if(y>=r[0]&&y<=r[1])c[i]++});
  });
  return '<div class="card" style="margin-top:10px"><div class="msg" style="margin:0 0 4px">Recuento de vacas por edad</div>'+b.map(function(r,i){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0'+(i?';border-top:1px solid var(--bd)':'')+'"><span>'+r[0]+' a '+r[1]+' Años:</span><b style="font-size:20px">'+c[i]+'</b></div>'}).join('')+'</div>';
}
function carga(p){
  var K={TORO:1,VACA:1,NOVILLO:0.6,NOVILLA:0.6,TERNERO:0.4},n=0,u=0,sin=0,s=parseFloat(p.superficie)||0;
  animals.forEach(function(a){if(a.parcela!==p.id)return;n++;var k=K[tipo(a)];if(k==null)sin++;else u+=k});
  return {n:n,ugm:u,sin:sin,anHa:s>0?n/s:null,ugmHa:s>0?u/s:null};
}
function cargaHtml(p){
  var c=carga(p),T={TORO:0,NOVILLO:0,VACA:0,NOVILLA:0,TERNERO:0};
  animals.forEach(function(a){if(a.parcela===p.id){var t=tipo(a);if(T[t]!=null)T[t]++}});
  var f=function(k,v){return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+k+'</span><b>'+v+'</b></div>'};
  return '<div class="card" style="margin-top:10px"><div class="msg" style="margin:0 0 4px">Carga ganadera</div>'+
    f('Animales',c.n)+'<div class="msg" style="margin:0 0 6px">'+T.TORO+' toros · '+T.NOVILLO+' novillos · '+T.VACA+' vacas · '+T.NOVILLA+' novillas · '+T.TERNERO+' terneros</div>'+
    f('UGM totales',fmtHa(c.ugm))+f('Animales por hectárea',c.anHa==null?'—':fmtHa(c.anHa))+f('UGM por hectárea',c.ugmHa==null?'—':fmtHa(c.ugmHa))+
    (c.sin?'<div class="msg">'+c.sin+' animal(es) sin fecha de nacimiento o sin sexo definido no cuentan en las UGM.</div>':'')+
    (c.ugmHa==null?'<div class="msg">Indica la superficie para calcular la carga por hectárea.</div>':'')+
    '<div class="msg" style="margin:6px 0 0">UGM (unidad de ganado mayor): ternero 0,4 · novillo/novilla 0,6 · vaca/toro 1.</div></div>';
}
function actCarga(){var e=$('#cg');if(e&&curP)e.innerHTML=cargaHtml(curP)}
function isoToEs(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''}
function fechaProc(el,ev){
  ev=ev||window.event;
  var del=!!(ev&&ev.inputType&&ev.inputType.indexOf('delete')===0);
  var dg=el.value.replace(/\D/g,'').slice(0,8),s;
  if(dg.length==6&&!del)dg=dg.slice(0,4)+'20'+dg.slice(4);
  s=dg;if(dg.length>4)s=dg.slice(0,2)+'/'+dg.slice(2,4)+'/'+dg.slice(4);else if(dg.length>2)s=dg.slice(0,2)+'/'+dg.slice(2);
  el.value=s;
  var ok=false,iso='';
  if(dg.length==8){var dd=+dg.slice(0,2),mm=+dg.slice(2,4),aa=+dg.slice(4),t=new Date(aa,mm-1,dd);ok=aa>=2000&&aa<2100&&t.getFullYear()==aa&&t.getMonth()==mm-1&&t.getDate()==dd;if(ok)iso=dg.slice(4)+'-'+dg.slice(2,4)+'-'+dg.slice(0,2)}
  return {iso:iso,ok:ok,full:dg.length==8};
}
function fechaEs(el,ev){
  var r=fechaProc(el,ev);if(cur)cur._dirty=1;
  var h=new Date(),hs=h.getFullYear()+'-'+('0'+(h.getMonth()+1)).slice(-2)+'-'+('0'+h.getDate()).slice(-2);
  var ok=r.ok&&r.iso<=hs;
  cur.nacimiento=ok?r.iso:'';
  el.classList.toggle('bad',r.full&&!ok);
  $('#ed').textContent=(ok&&edad(r.iso))||(r.full&&!ok?'Fecha no válida':'—');actMadre();actPartos();
}
function csv(rows){return '\ufeff'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n')}
async function guardaArchivo(name,data){var m=$('#bm');try{var dl=await claude.use('downloads');if(!dl){m.textContent='La descarga no está disponible aquí.';return}await dl.save({filename:name,data:data});m.textContent=bmTxt()}catch(e){m.textContent=(e&&e.code=='declined')?'Descarga cancelada.':'No se pudo descargar el archivo.'}}
function expCsv(t){
  var r=[],hoy=new Date().toISOString().slice(0,10);
  if(t=='partos'){r.push(['Número de identificación','Código del animal','Nombre','Sexo','Raza','Nº crotales','Nacimiento','Edad','Parcela','Fecha parto','Sexo ternero','Destino','Intervalo (días)']);
    animals.forEach(function(a){var p=(a.partos||[]).slice().sort(function(x,y){return (x.fecha||'')<(y.fecha||'')?-1:1});var base=[a.crotal,c4(a),a.nombre,a.sexo,a.raza,a.ncrotales||'',isoToEs(a.nacimiento),edad(a.nacimiento),nomP(a.parcela)];
      if(!p.length){r.push(base.concat(['','','','']));return}
      p.forEach(function(x,i){var iv=(i>0&&x.fecha&&p[i-1].fecha)?Math.round((d(x.fecha)-d(p[i-1].fecha))/864e5):'';r.push(base.concat([isoToEs(x.fecha),x.sexo,dest(x),iv]))})})}
  else{r.push(['Número de identificación','Código del animal','Nombre','Fecha','Tipo','Descripción / producto','Veterinario','Notas']);
    animals.forEach(function(a){(a.vet||[]).forEach(function(v){r.push([a.crotal,c4(a),a.nombre,isoToEs(v.fecha),v.tipo,v.desc,v.vet,v.notas])})})}
  guardaArchivo('ganaderia-'+t+'-'+hoy+'.csv',csv(r));
}
function expJson(){ajustes.lastBackup=new Date().toISOString().slice(0,10);if(acol)acol.doc('general').set(ajustes);guardaArchivo('ganaderia-copia-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,animales:animals,parcelas:parcelas,ajustes:ajustes},null,1))}
function impJson(){
  var i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async function(){var f=i.files[0];if(!f)return;var m=$('#bm');
    try{var o=JSON.parse(await f.text());var l=o.animales||[];if(!l.length){m.textContent='La copia no contiene animales.';return}
      if(!confirm('Se restaurarán '+l.length+' fichas. Las que tengan el mismo identificador se sobrescribirán. ¿Continuar?'))return;
      for(var k=0;k<l.length;k++){var a=l[k];['fotoCabeza','fotoLateral'].forEach(function(f){if(String(a[f]||'').indexOf('/_blob/')===0)a[f]=''});if(col)await col.doc(a.id).set(a);else{var j=animals.findIndex(function(z){return z.id===a.id});if(j>-1)animals[j]=a;else animals.push(a)}}
      if(o.ajustes){ajustes=Object.assign({saneamiento:''},o.ajustes);if(acol)await acol.doc('general').set(ajustes)}
      var pl=o.parcelas||[];for(var z=0;z<pl.length;z++){if(pcol)await pcol.doc(pl[z].id).set(pl[z]);else{var w=parcelas.findIndex(function(y){return y.id===pl[z].id});if(w>-1)parcelas[w]=pl[z];else parcelas.push(pl[z])}}
      m.textContent='Restauradas '+l.length+' fichas.';if(!col)render()}catch(e){m.textContent='No se pudo leer la copia.'}};
  i.click();
}
